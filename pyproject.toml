[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synology"
version = "0.2.2"
description = "Manage Synology NAS devices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "synology-api @ git+https://github.com/N4S4/synology-api.git@v0.9.2",
  "PyYAML>=6.0,<7",
  "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
syn-cli = "synology.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
dev = ["ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true
