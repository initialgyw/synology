[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synology_manager"]

[tool.hatch.build.targets.wheel.force-include]
"sample_config.yaml" = "synology_manager/sample_config.yaml"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/sample_config.yaml", "/pyproject.toml", "/.gitignore"]
exclude = [
  "/.opencode",
  "/.venv",
  "/dist",
  "/build",
  "/uv.lock",
  "/credentials.json",
  "/.env",
  "/.env.*",
]

[project]
name = "synology-manager"
version = "0.1.0"
description = "Safety-first declarative manager for Synology shared folders"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<3",
  "pytest>=9,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11",
]

[project.scripts]
synology-manager = "synology_manager.cli:main"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=synology_manager --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["synology_manager"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "build>=1.5.0",
    "types-pyyaml>=6.0.12.20260724",
]
